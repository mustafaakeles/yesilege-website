name: Site kalite kontrolleri
on:
  push:
    branches:
      - audit-fixes-2026-10-26
      - main
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python tools/build_layout.py --check
      - run: npm install --no-save --package-lock=false @electric-sql/pglite@0.3.15
      - run: node tools/db_test.mjs
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1 @electric-sql/pglite@0.3.15
      - run: npx playwright install --with-deps chromium
      - run: node tools/ui_smoke.mjs
      - run: node tools/auth_e2e.mjs
      - run: node tools/shop_e2e.mjs
      - run: node tools/admin_e2e.mjs
      - name: Görsel denetim ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: |
            artifacts/ui-smoke/
            artifacts/auth-e2e/
            artifacts/shop-e2e/
            artifacts/admin-e2e/
          if-no-files-found: ignore
