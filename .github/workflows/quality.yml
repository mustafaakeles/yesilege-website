name: Site kalite kontrolleri
on:
  push:
    branches:
      - audit-fixes-2026-10-26
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python tools/build_layout.py --check
