<!DOCTYPE html>
<html lang="tr">

<head>

        rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;

            justify-content: center;

            background: #1a3c34;

        a {

    <main>
        <img src="/images/logo1.png" alt="Yeşil Ege" style="width: 120px; height: auto;">
